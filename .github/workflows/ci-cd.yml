name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: Tests
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test:unit

  release:
    name: Semantic Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run semantic-release
        run: bunx semantic-release --branches dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-dev:
    name: Build & Push Dev Docker Image
    needs: [test, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Dev Docker image tags
        run: |
          git fetch --tags
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "TAG_DEV=${IMAGE_NAME}:${VERSION_TAG}-dev" >> $GITHUB_ENV
          echo "TAG_DEV_LATEST=${IMAGE_NAME}:dev-latest" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.TAG_DEV }}
            ${{ env.TAG_DEV_LATEST }}

  build-main:
    name: Tag & Push Prod Docker Image (From Dev Image)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag Dev Docker image with Prod tags
        run: |
          git fetch --tags

          # Determine the commit merged from dev (HEAD^2 if merge commit, otherwise HEAD)
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            MERGED_COMMIT="HEAD^2"
          else
            MERGED_COMMIT="HEAD"
          fi

          # Get exact tag on the merged commit, or fail if no exact tag exists
          VERSION_TAG=$(git describe --tags --exact-match "$MERGED_COMMIT")
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          DEV_IMAGE="${IMAGE_NAME}:${VERSION_TAG}-dev"
          PROD_IMAGE="${IMAGE_NAME}:${VERSION_TAG}"
          PROD_LATEST="${IMAGE_NAME}:latest"

          echo "Target version tag: ${VERSION_TAG}"
          echo "Pulling specific dev image: ${DEV_IMAGE}..."
          docker pull "${DEV_IMAGE}"

          echo "Retagging ${DEV_IMAGE} to ${PROD_IMAGE} and ${PROD_LATEST}"
          docker tag "${DEV_IMAGE}" "${PROD_IMAGE}"
          docker tag "${DEV_IMAGE}" "${PROD_LATEST}"

          echo "Pushing production images..."
          docker push "${PROD_IMAGE}"
          docker push "${PROD_LATEST}"

  deploy:
    name: Deploy via SSH
    needs: build-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            docker compose pull && docker compose up -d --remove-orphans
